<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STT Cipasung - Profil Kampus</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 960px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
            color: #333;
        }

        header {
            background-color: #003366;
            color: white;
            padding: 20px;
            border-radius: 8px;
        }

        header h1 {
            margin: 0;
        }

        nav {
            margin: 20px 0;
        }

        nav a {
            color: #003366;
            margin-right: 16px;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        section {
            margin-bottom: 24px;
        }

        section h2 {
            color: #003366;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
        }

        form label {
            display: block;
            margin-top: 12px;
        }

        form input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
        }

        form button {
            margin-top: 12px;
            padding: 10px 20px;
            background-color: #003366;
            color: white;
            border: none;
            cursor: pointer;
        }

        footer {
            margin-top: 30px;
            padding: 16px;
            text-align: center;
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>
    <header>
        <h1>STT Cipasung</h1>
        <p>Sekolah Tinggi Teknologi Cipasung</p>
    </header>

    <nav>
        <a href="#about">About Us</a>
        <a href="#contact">Contact Us</a>
    </nav>

    <main>
        <section id="about">
            <h2>About Us</h2>
            <p>
                STT Cipasung merupakan perguruan tinggi yang berfokus
                pada pengembangan ilmu pengetahuan dan teknologi.
            </p>

            <img
                src="https://placehold.co/600x250"
                alt="Gambar ilustrasi kampus STT Cipasung"
            >
        </section>

        <section id="contact">
            <h2>Contact Us</h2>
            <p>Silakan isi formulir berikut untuk menghubungi kami.</p>

            <form>
                <label for="name">Nama</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

                <button type="submit">Kirim</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 STT Cipasung</p>
    </footer>
</body>
</html>
